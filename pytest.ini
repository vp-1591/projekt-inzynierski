[pytest]
testpaths = backend/tests
pythonpath = backend
cache_dir = backend/tests/.pytest_cache
addopts =
    -p no:cacheprovider
    -p no:anyio
    -p no:asyncio
    -p no:langsmith
    -p no:mock
    -p no:typeguard
norecursedirs = .* __pycache__ .venv .venv-wsl vendor pytest-cache-files-*
markers =
    integration: tests that require opt-in local integration services
    ollama: tests that require a reachable local Ollama server and model
    wsl: tests that require WSL and the backend WSL virtualenv
    websocket: tests that exercise websocket clients and broadcasts
