# Ruff configuration for the backend
# See https://docs.astral.sh/ruff/configuration/

line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

exclude = [
    "vendor/",
    ".venv/",
    ".venv-wsl/",
]

[format]
exclude = [
    "vendor/",
    ".venv/",
    ".venv-wsl/",
]